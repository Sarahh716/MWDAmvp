<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MWDA: fashion made easy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbfaf6;--surface:#fff;--ink:#16224a;--muted:#5d6584;--line:#e3e0d6;--teal:#1b8a72;--orange:#c85a14;--tint:#e9f3ef;--on-ink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101426;--surface:#171c33;--ink:#eceff8;--muted:#a3abc8;--line:#2a3150;--teal:#4cc3a6;--orange:#f2955a;--tint:#183029;--on-ink:#101426}}
:root[data-theme="dark"]{--bg:#101426;--surface:#171c33;--ink:#eceff8;--muted:#a3abc8;--line:#2a3150;--teal:#4cc3a6;--orange:#f2955a;--tint:#183029;--on-ink:#101426}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "DM Sans",system-ui,sans-serif;min-height:100%}
h1,h2,h3{font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;margin:0;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.gingham{background:conic-gradient(var(--teal) 25%,var(--surface) 0 50%,var(--teal) 0 75%,var(--surface) 0) 0 0/12px 12px}
header{border-bottom:1px solid var(--line);background:var(--surface)}
header .strip{height:10px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.brand{display:flex;align-items:baseline;gap:14px;padding:22px 0 10px;flex-wrap:wrap}
.brand h1{font-size:2.6rem;font-weight:800;letter-spacing:-.02em}
.brand p{margin:0;color:var(--muted);font-size:1.05rem}
nav{display:flex;gap:4px}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 18px;font-weight:700;color:var(--muted)}
nav button[aria-selected="true"]{color:var(--ink);border-color:var(--orange)}
main{padding:28px 0 64px}
section[hidden]{display:none}
.lede{color:var(--muted);margin:6px 0 22px;max-width:60ch}
h2{font-size:1.7rem;font-weight:800;margin-bottom:4px}
h3{font-size:1.15rem;font-weight:600;margin:30px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.sw{height:130px;display:grid;place-items:center}
.sw svg{width:84px;height:84px}
.cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.store{font-weight:700}
.pill{font-size:.78rem;font-weight:700;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);margin-left:6px}
.pill.thrift{background:var(--tint);color:var(--teal);border-color:var(--teal)}
.price{font-family:"Bricolage Grotesque",sans-serif;font-size:1.35rem;font-weight:800}
.sub{color:var(--muted);font-size:.9rem}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:10px}
.chk{display:flex;align-items:center;gap:6px;font-size:.92rem}
.chk input{accent-color:var(--teal);width:18px;height:18px}
.btn{border:1px solid var(--ink);background:none;border-radius:8px;padding:6px 12px;font-weight:700;font-size:.9rem}
.btn[aria-pressed="true"],.btn.solid{background:var(--ink);color:var(--on-ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:700}
thead th{font-family:"Bricolage Grotesque",sans-serif;font-size:1.02rem}
tbody th{color:var(--muted);font-weight:500;width:150px}
tr:last-child th,tr:last-child td{border-bottom:0}
th.thr,td.thr{background:var(--tint);box-shadow:inset 6px 0 0 var(--teal)}
td.best{font-weight:700;color:var(--teal)}
.bars{margin-top:18px;display:grid;gap:8px}
.bar{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font-size:.92rem}
.bar i{display:block;height:14px;border-radius:3px;background:var(--ink)}
.bar i.t{background:var(--teal)}
.verdict{margin-top:16px;padding:14px 16px;border-left:6px solid var(--orange);background:var(--surface);border-radius:0 8px 8px 0}
.note{color:var(--muted);font-size:.85rem;margin-top:14px;max-width:70ch}
.me{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.av{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--on-ink);font:800 1.6rem "Bricolage Grotesque",sans-serif;flex:none}
.av.s{width:42px;height:42px;font-size:1rem}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 16px;text-align:left}
.stat b{display:block;font:800 1.4rem "Bricolage Grotesque",sans-serif}
.stat[aria-pressed="true"]{border-color:var(--orange);box-shadow:inset 0 -4px 0 var(--orange)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .g{flex:1;min-width:0}
.li .g small{display:block;color:var(--muted)}
.empty{padding:18px;color:var(--muted)}
.feed{display:grid;gap:12px;max-width:680px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;gap:12px}
.post.store .av{background:var(--teal);color:var(--surface)}
.post p{margin:2px 0 8px}
.post small{color:var(--muted)}
.tag{display:inline-block;background:var(--tint);color:var(--teal);font-weight:700;font-size:.8rem;padding:1px 8px;border-radius:99px;margin-right:6px}
.sw{position:relative}
.sw.New,.tile.New{background:#ece6d8}.sw.Resale,.tile.Resale{background:#dfe6f0}
.pill.Resale{border-color:var(--orange);color:var(--orange)}
.card.sold{opacity:.65}
.soldtag,.fresh{position:absolute;top:8px;left:8px;font-size:.78rem;font-weight:700;padding:2px 10px;border-radius:99px}
.soldtag{background:var(--ink);color:var(--on-ink)}.fresh{background:var(--teal);color:var(--surface)}
.row{flex-wrap:wrap}
.btn:disabled{opacity:.5;cursor:default}
.sbar input{width:100%;padding:12px 18px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink);font:inherit}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.filters select{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.explore{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:150px;grid-auto-flow:dense;gap:4px}
@media (min-width:700px){.explore{grid-template-columns:repeat(4,1fr);grid-auto-rows:200px}}
.tile{position:relative;border:0;padding:0;display:grid;place-items:center;overflow:hidden}
.tile:nth-child(5n+1){grid-row:span 2}
.tile svg{width:46%;height:46%}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;font-size:.8rem;font-weight:700;color:#fff;text-align:left;background:linear-gradient(transparent,rgba(16,20,38,.8))}
@media (max-width:560px){.brand h1{font-size:2.1rem}nav button{padding:12px 12px}.bar{grid-template-columns:90px 1fr 60px}}
@media (prefers-reduced-motion:no-preference){.verdict{animation:in .35s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="shirt" viewBox="0 0 100 100"><path d="M36 12 18 22 5 43l15 8 6-8v46h48V43l6 8 15-8-13-21-18-10c-3 9-25 9-28 0Z" fill="currentColor" stroke="#16224a" stroke-width="3" stroke-linejoin="round"/><path d="M50 22v64" stroke="#16224a" stroke-width="2"/></symbol>
<symbol id="pants" viewBox="0 0 100 100"><path d="M30 10h40l6 82H56L50 42l-6 50H24Z" fill="currentColor" stroke="#16224a" stroke-width="3" stroke-linejoin="round"/></symbol>
<symbol id="dress" viewBox="0 0 100 100"><path d="M42 8h16l3 24 20 60H19l20-60Z" fill="currentColor" stroke="#16224a" stroke-width="3" stroke-linejoin="round"/></symbol>
<symbol id="bag" viewBox="0 0 100 100"><path d="M22 38h56l6 54H16Z" fill="currentColor" stroke="#16224a" stroke-width="3" stroke-linejoin="round"/><path d="M36 38c0-20 28-20 28 0" fill="none" stroke="#16224a" stroke-width="3"/></symbol>
</defs></svg>
<header>
  <div class="strip gingham"></div>
  <div class="wrap">
    <div class="brand"><h1>MWDA</h1><p>fashion made easy</p></div>
    <nav role="tablist" aria-label="Sections">
      <button role="tab" id="t-search" data-tab="search">Search</button>
      <button role="tab" id="t-thrift" data-tab="thrift">Thrifting</button>
      <button role="tab" id="t-resale" data-tab="resale">Resale</button>
      <button role="tab" id="t-profile" data-tab="profile">Profile</button>
    </nav>
  </div>
</header>
<main class="wrap">
  <section id="search" role="tabpanel" hidden></section>
  <section id="thrift" role="tabpanel" hidden></section>
  <section id="resale" role="tabpanel" hidden></section>
  <section id="profile" role="tabpanel" hidden></section>
</main>
<script>
var K="id,store,kind,name,price,cond,cat,who,color,hex,size,style,tags".split(",");
var raw=[
["zara","Zara","New","Poplin shirt",149,100,"Tops","Women","White","#ffffff","XS S M L XL","Casual","cotton shirt classic"],
["hm","H&M","New","Regular-fit cotton shirt",99,100,"Tops","Men","White","#ffffff","S M L XL","Casual","cotton shirt"],
["gio","Giordano","New","Classic Oxford shirt",119,100,"Tops","Men","White","#ffffff","S M L XL","Formal","oxford shirt cotton"],
["zdj","Zara","New","Denim jacket",229,100,"Outerwear","Women","Blue","#5b7fa6","S M L","Casual","denim jacket"],
["hmt","H&M","New","Linen trousers",129,100,"Bottoms","Women","Beige","#d8c7a5","XS S M L","Casual","linen summer trousers"],
["gip","Giordano","New","Knit polo",89,100,"Tops","Men","Black","#2a2d3a","M L XL","Casual","knit polo"],
["sam","Sam’s Store, Nahda","Thrift","Pre-loved cotton shirt",25,78,"Tops","Women","White","#ffffff","M","Casual","vintage cotton shirt"],
["sdr","Sam’s Store, Nahda","Thrift","Vintage midi dress",45,80,"Dresses","Women","Green","#4f7f6a","S M","Casual","vintage dress"],
["sbg","Sam’s Store, Nahda","Thrift","Pre-loved leather bag",60,85,"Bags","Women","Brown","#7a4b2a","OS","Formal","leather vintage bag"],
["sdn","Sam’s Store, Nahda","Thrift","Pre-loved denim shirt",30,82,"Tops","Men","Blue","#6f8fb5","L","Streetwear","denim vintage shirt"],
["smc","Sam’s Store, Nahda","Thrift","Wool overcoat",70,75,"Outerwear","Men","Grey","#6b6f76","L XL","Formal","wool coat"],
["str","Sam’s Store, Nahda","Thrift","Pleated trousers",28,79,"Bottoms","Men","Black","#2a2d3a","M L","Formal","trousers pleated"],
["skt","Sam’s Store, Nahda","Thrift","Kids striped tee",12,80,"Tops","Children","Navy","#2d4a8a","Kids","Casual","kids stripe tee"],
["skd","Sam’s Store, Nahda","Thrift","Kids floral dress",18,85,"Dresses","Children","Pink","#e7a1b5","Kids","Casual","kids floral dress"],
["rtc","Re:Wear marketplace","Resale","Zara trench coat",120,90,"Outerwear","Women","Beige","#c8b08a","S M","Formal","trench coat zara"],
["rsd","@layla.closet","Resale","Satin slip dress",85,92,"Dresses","Women","Black","#2a2d3a","S","Streetwear","satin dress party"],
["rjn","Closet Swap DXB","Resale","Straight-leg jeans",65,88,"Bottoms","Women","Blue","#4a6a94","M L","Casual","denim jeans"],
["rlm","@omar.resells","Resale","Linen shirt",55,90,"Tops","Men","White","#ffffff","M L","Casual","linen shirt"],
["rtt","Re:Wear marketplace","Resale","Canvas tote",40,95,"Bags","Women","Cream","#e8dcc0","OS","Casual","canvas tote bag"]];
var items=raw.map(function(r){var o={};K.forEach(function(k,n){o[k]=r[n]});return o});
var notes={sam:"Light collar wear, no stains"},fresh={sam:1,sdr:1,skd:1,rsd:1};
var SYM={Tops:"shirt",Outerwear:"shirt",Bottoms:"pants",Dresses:"dress",Bags:"bag"};
var LISTS={cat:["Tops","Bottoms","Dresses","Outerwear","Bags"],color:["White","Black","Blue","Beige","Grey","Green","Pink","Brown","Navy","Cream"],size:["XS","S","M","L","XL","OS","Kids"],style:["Casual","Formal","Streetwear"],kind:["New","Thrift","Resale"]};
var LBL={cat:"Category",color:"Colour",size:"Size",style:"Style",kind:"Source"};
var TAGS=["vintage","denim","linen","cotton","kids","leather","wool"];
var sel={zara:1,hm:1,gio:1,sam:1},sold={},q="",fl={};
var wish=[{name:"Denim jacket",store:"Zara",price:229},{name:"Pre-loved leather bag",store:"Sam’s Store, Nahda",price:60}];
var bought=[{name:"Linen trousers",store:"H&M",price:129,when:"Sep 2026"},{name:"Pre-loved denim shirt",store:"Sam’s Store, Nahda",price:30,when:"Aug 2026"},{name:"Knit polo",store:"Giordano",price:89,when:"Jun 2026"}];
var people=["Mariam R.","Omar H.","Dana S.","Yusuf A.","Huda T.","Khalid M."];
var stores=["Sam’s Store, Nahda","Zara","H&M","Giordano"];
var followers=new Set(["Mariam R.","Omar H.","Dana S.","Yusuf A.","Huda T."]);
var following=new Set(["Mariam R.","Omar H.","Sam’s Store, Nahda","Zara","H&M"]);
var tab="search",pview="wishlist",tw="Women",rs="All";
var $=function(s){return document.querySelector(s)};
function adj(i){return Math.round(i.price/(i.cond/100))}
function ini(n){return n.replace(/[^A-Za-z ]/g,"").split(" ").map(function(w){return w[0]}).join("").slice(0,2).toUpperCase()}
function inWish(n){return wish.some(function(w){return w.name===n})}
function ico(i){return '<svg role="img" aria-label="'+i.color+" "+i.cat+'" style="color:'+i.hex+'"><use href="#'+SYM[i.cat]+'"/></svg>'}
function pill(i){return '<span class="pill '+i.kind+'">'+i.kind+'</span>'}
function card(i){
 var s=sold[i.id],nw=i.kind==="New";
 return '<article class="card'+(s?" sold":"")+'"><div class="sw '+i.kind+(i.kind==="Thrift"?" gingham":"")+'">'+ico(i)+(s?'<span class="soldtag">Sold</span>':fresh[i.id]?'<span class="fresh">Just in</span>':'')+'</div><div class="cb"><div><span class="store">'+i.store+'</span>'+pill(i)+'</div><div class="sub">'+i.name+'</div><div class="price">AED '+i.price+'</div><div class="sub">'+(nw?"New · "+i.color+", "+i.size:"Condition "+i.cond+"/100"+(notes[i.id]?": "+notes[i.id]:""))+'</div>'+
 '<div class="row"><label class="chk"><input type="checkbox" data-cmp="'+i.id+'"'+(sel[i.id]?" checked":"")+'> Compare</label><button class="btn" data-wish="'+i.id+'" aria-pressed="'+inWish(i.name)+'">'+(inWish(i.name)?"Wishlisted":"Wishlist")+'</button>'+(nw?"":'<button class="btn solid" data-buy="'+i.id+'"'+(s?" disabled":"")+'>'+(s?"Sold":"Buy")+'</button>')+'</div></div></article>'}
function tile(i){return '<button class="tile '+i.kind+(i.kind==="Thrift"?" gingham":"")+'" data-open="'+i.id+'" aria-label="'+i.name+', '+i.store+', AED '+i.price+'">'+ico(i)+'<span class="cap">AED '+i.price+' · '+i.kind+'</span></button>'}
function compare(){
 var s=items.filter(function(i){return sel[i.id]});
 if(s.length<2)return "";
 var best=Math.min.apply(null,s.map(adj));
 function r(l,f,b){return '<tr><th scope="row">'+l+'</th>'+s.map(function(i){return '<td class="'+(i.kind==="Thrift"?"thr ":"")+(b&&adj(i)===best?"best":"")+'">'+f(i)+'</td>'}).join("")+'</tr>'}
 var h='<h3>Compare selected</h3><div class="tw"><table><thead><tr><th></th>'+s.map(function(i){return '<th class="'+(i.kind==="Thrift"?"thr":"")+'">'+i.store+'</th>'}).join("")+'</tr></thead><tbody>'+
 r("Item",function(i){return i.name})+r("Price",function(i){return "AED "+i.price})+
 r("Condition",function(i){return i.kind==="New"?"New":i.cond+"/100, "+i.kind.toLowerCase()})+
 r("Condition-adjusted price",function(i){return "AED "+adj(i)},1)+
 r("Colour",function(i){return i.color})+r("Size",function(i){return i.size})+'</tbody></table></div>';
 var max=Math.max.apply(null,s.map(adj));
 h+='<div class="bars" aria-label="Condition-adjusted price">'+s.map(function(i){return '<div class="bar"><span>'+i.store+'</span><i class="'+(i.kind==="New"?"":"t")+'" style="width:'+Math.max(4,adj(i)/max*100)+'%"></i><b>AED '+adj(i)+'</b></div>'}).join("")+'</div>';
 var u=s.filter(function(i){return i.kind!=="New"}).sort(function(a,b){return adj(a)-adj(b)})[0],n=s.filter(function(i){return i.kind==="New"}).sort(function(a,b){return a.price-b.price})[0];
 if(u&&n&&adj(u)<n.price)h+='<div class="verdict"><b>Best value: '+u.store+'.</b> Adjusted for condition it costs AED '+adj(u)+', which is '+Math.round((1-adj(u)/n.price)*100)+'% less than the cheapest new option ('+n.store+', AED '+n.price+').</div>';
 return h+'<p class="note">Condition-adjusted price turns a second-hand price into a new-equivalent price using condition, wear, age and material. These are sample listings with illustrative prices.</p>'}
function opts(k){return '<select data-f="'+k+'" aria-label="'+LBL[k]+'"><option value="">'+LBL[k]+'</option>'+LISTS[k].map(function(v){return '<option'+(fl[k]===v?" selected":"")+'>'+v+'</option>'}).join("")+'</select>'}
function search(){
 return '<h2>Search</h2><div class="sbar" style="margin-top:12px"><input id="q" type="search" placeholder="Search shirts, denim, vintage, linen…" value="'+q.replace(/"/g,"&quot;")+'" aria-label="Search clothing"></div><div class="filters">'+Object.keys(LISTS).map(opts).join("")+'<button class="btn" data-clear="1">Clear</button></div><div class="chips">'+TAGS.map(function(t){return '<button class="chip" data-tag="'+t+'" aria-pressed="'+(q===t)+'">#'+t+'</button>'}).join("")+'</div><div id="sres"></div>'}
function match(i){
 var h=[i.name,i.store,i.tags,i.color,i.cat,i.style,i.who,i.kind].join(" ").toLowerCase();
 return q.toLowerCase().split(/\s+/).filter(Boolean).every(function(w){return h.indexOf(w)>-1})&&(!fl.cat||i.cat===fl.cat)&&(!fl.color||i.color===fl.color)&&(!fl.style||i.style===fl.style)&&(!fl.kind||i.kind===fl.kind)&&(!fl.size||(" "+i.size+" ").indexOf(" "+fl.size+" ")>-1)}
function sres(){
 var on=q.trim()||Object.keys(fl).some(function(k){return fl[k]}),h;
 if(on){var r=items.filter(match);h='<p class="sub">'+r.length+" result"+(r.length===1?"":"s")+'</p>'+(r.length?'<div class="grid">'+r.map(card).join("")+'</div>':'<p class="empty">Nothing matched. Try another word or clear the filters.</p>')}
 else h='<h3>Explore</h3><div class="explore">'+items.map(tile).join("")+'</div>';
 $("#sres").innerHTML=h+compare()}
function thrift(){
 var l=items.filter(function(i){return i.kind==="Thrift"&&i.who===tw}),a=l.filter(function(i){return!sold[i.id]}).length;
 l.sort(function(x,y){return(!!sold[x.id])-(!!sold[y.id])});
 return '<h2>Thrifting</h2><p class="lede">One-of-a-kind second-hand pieces from local stores. Stock changes as items sell and new ones arrive.</p><div class="chips">'+["Men","Women","Children"].map(function(w){return '<button class="chip" data-tw="'+w+'" aria-pressed="'+(tw===w)+'">'+w+'</button>'}).join("")+'</div><p class="sub" style="margin-bottom:12px">'+a+" available, "+(l.length-a)+' sold</p><div class="grid">'+l.map(card).join("")+'</div>'+compare()}
function resale(){
 var S=["All"];items.forEach(function(i){if(i.kind==="Resale"&&S.indexOf(i.store)<0)S.push(i.store)});
 var l=items.filter(function(i){return i.kind==="Resale"&&(rs==="All"||i.store===rs)});
 return '<h2>Resale</h2><p class="lede">Pre-owned pieces from participating sellers and platforms.</p><div class="chips">'+S.map(function(w){return '<button class="chip" data-rs="'+w+'" aria-pressed="'+(rs===w)+'">'+w+'</button>'}).join("")+'</div><div class="grid">'+l.map(card).join("")+'</div>'+compare()}
function personRow(n,isStore){
 var f=following.has(n);
 return '<div class="li"><div class="av s">'+ini(n)+'</div><div class="g"><b>'+n+'</b><small>'+(isStore?"Store":"Shopper")+'</small></div><button class="btn '+(f?"":"solid")+'" data-follow="'+n+'">'+(f?"Following":"Follow")+'</button></div>'}
var feed=[
 {w:"p",who:"Mariam R.",t:"Posted an outfit",txt:"White shirt, wide jeans, nothing else.",tag:"Giordano Classic Oxford shirt",time:"2h ago"},
 {w:"s",who:"Sam’s Store, Nahda",t:"New drop",txt:"14 white and cream shirts just listed.",tag:"Thrift",time:"3h ago",go:"thrift"},
 {w:"p",who:"Omar H.",t:"Bought",txt:"Regular-fit cotton shirt, AED 99.",tag:"H&M",time:"5h ago"},
 {w:"s",who:"Zara",t:"New arrivals",txt:"Linen-blend shirts in white and sand.",tag:"New",time:"Yesterday",go:"search"},
 {w:"p",who:"Dana S.",t:"Wishlisted",txt:"Pre-loved cotton shirt, AED 25.",tag:"Sam’s Store, Nahda",time:"Yesterday"}];
function post(p){return '<article class="post '+(p.w==="s"?"store":"")+'"><div class="av s">'+ini(p.who)+'</div><div><b>'+p.who+'</b> <small>'+p.t+' · '+p.time+'</small><p>'+p.txt+'</p><span class="tag">'+p.tag+'</span>'+(p.go?'<button class="btn" data-go="'+p.go+'">See listings</button>':"")+'</div></article>'}
function profile(){
 var v;
 if(pview==="wishlist")v=wish.length?'<div class="list">'+wish.map(function(w,k){return '<div class="li"><div class="g"><b>'+w.name+'</b><small>'+w.store+'</small></div><b>AED '+w.price+'</b><button class="btn" data-unwish="'+k+'">Remove</button></div>'}).join("")+'</div>':'<p class="empty">Your wishlist is empty. Tap Wishlist on any listing to save it here.</p>';
 else if(pview==="purchases")v='<div class="list">'+bought.map(function(w){return '<div class="li"><div class="g"><b>'+w.name+'</b><small>'+w.store+', '+w.when+'</small></div><b>AED '+w.price+'</b></div>'}).join("")+'</div>';
 else if(pview==="activity")v='<div class="feed">'+feed.map(post).join("")+'</div>';
 else if(pview==="followers")v='<div class="list">'+people.filter(function(p){return followers.has(p)}).map(function(p){return personRow(p)}).join("")+'</div>';
 else v='<div class="list">'+people.concat(stores).filter(function(p){return following.has(p)}).map(function(p){return personRow(p,stores.indexOf(p)>-1)}).join("")+(following.size?"":'<p class="empty">You aren’t following anyone yet.</p>')+'</div>';
 function st(k,l,n){return '<button class="stat" data-pv="'+k+'" aria-pressed="'+(pview===k)+'"><b>'+n+'</b>'+l+'</button>'}
 return '<div class="me"><div class="av">N</div><div><h2>Noor K.</h2><div class="sub">@noor.wears · Thrift first, new when I have to.</div></div></div>'+
 '<div class="stats">'+st("wishlist","Wishlist",wish.length)+st("purchases","Purchases",bought.length)+st("activity","Activity",feed.length)+st("followers","Followers",248)+st("following","Following",127+following.size)+'</div><h3>'+({wishlist:"Wishlist",purchases:"Past purchases",activity:"From people and stores you follow",followers:"Followers",following:"Following"})[pview]+'</h3>'+v}
var views={search:search,thrift:thrift,resale:resale,profile:profile};
function render(){
 Object.keys(views).forEach(function(k){
  var el=$("#"+k),on=k===tab;el.hidden=!on;$("#t-"+k).setAttribute("aria-selected",on);
  if(on){el.innerHTML=views[k]();if(k==="search")sres()}});
}
function go(k){tab=k;if(location.hash!=="#"+k)location.hash=k;render();window.scrollTo(0,0)}
document.addEventListener("click",function(e){
 var b=e.target.closest("button");if(!b)return;var d=b.dataset;
 if(d.tab)return go(d.tab);
 if(d.go)return go(d.go);
 if(d.wish){var i=items.filter(function(x){return x.id===d.wish})[0];
  if(inWish(i.name))wish=wish.filter(function(w){return w.name!==i.name});else wish.push({name:i.name,store:i.store,price:i.price})}
 else if(d.buy){var p=items.filter(function(x){return x.id===d.buy})[0];sold[p.id]=1;bought.unshift({name:p.name,store:p.store,price:p.price,when:"Just now"})}
 else if(d.open){var o=items.filter(function(x){return x.id===d.open})[0];q=o.name.split(" ").pop().toLowerCase();fl={}}
 else if(d.tag)q=q===d.tag?"":d.tag;
 else if(d.clear){q="";fl={}}
 else if(d.tw)tw=d.tw;
 else if(d.rs)rs=d.rs;
 else if(d.unwish)wish.splice(+d.unwish,1);
 else if(d.pv)pview=d.pv;
 else if(d.follow){if(following.has(d.follow))following.delete(d.follow);else following.add(d.follow)}
 else return;
 render()});
document.addEventListener("input",function(e){if(e.target.id==="q"){q=e.target.value;sres()}});
document.addEventListener("change",function(e){var t=e.target,d=t.dataset;
 if(d.f){fl[d.f]=t.value;sres()}else if(d.cmp){sel[d.cmp]=t.checked?1:0;render()}});
function route(){var h=location.hash.slice(1);tab=views[h]?h:"search";render()}
window.addEventListener("hashchange",route);route();
</script>
</body>
</html>
